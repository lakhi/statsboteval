[project]
name = "statsboteval-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
authors = [{ name = "Akshay Lakhi", email = "akshay.lakhi@univie.ac.at" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "duckdb>=1.0",
    "jsonschema>=4.21",
    "azure-storage-blob>=12.19",
    "pymysql>=1.1",
    "lingua-language-detector>=2.0",
    "openai>=1.40",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest", "hypothesis", "types-jsonschema", "types-PyMySQL"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["statsboteval_pipeline*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]
